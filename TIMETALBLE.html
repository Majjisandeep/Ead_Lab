<!DOCTYPE html>
<html>
<head>
    <title>IT-2 Time Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center text-dark mb-4">IT2 Time Table</h2>
        
        <table class="table table-bordered text-center table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Timings</th>
                    <th>9-10 AM</th>
                    <th>10-11AM</th>
                    <th>11-12AM</th>
                    <TH>12-1PM</TH>
                    <th>1-2PM</th>
                    <th>2-3PM</th>
                    <th>3-4PM</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>EAD</td>
                    <td>SE</td>
                    <td >CN lab</td>
                    <TD class="table-warning">Lunch</TD>
                    <TD>CN lab</TD>
                    
                    <td>PE-2</td>
                    <td>CN</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>CN</td>
                    <td>EAD</td>
                    <td>ML</td>
                    <TD class="table-warning">Lunch</TD>
                    <td>FLAT</td>
                    <td colspan="2">CT Lab</td>
                    
                    
                </tr>
                <tr>
                    <td>Wednessday</td>
                    <td>PE-2</td>
                    <td>FLAT</td>
                    <td>ML</td>
                    <TD class="table-warning">Lunch</TD>
                    <td>SE</td>
                    <td>Sports</td>
                    <td>Library</td>
                    
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td colspan="2">ML lab</td>
                    
                    <td>CN</td>
                    <TD class="table-warning">Lunch</TD>
                    <td>EAD</td>
                    <td colspan="2">CC Lab</td>
                    
                    
                </tr>
                <tr>
                    <td>Friday</td>
                    <td>SE</td>
                    <td>ML</td>
                    <td>FLAT</td>
                    <TD class="table-warning">Lunch</TD>
                    <td>PE-2</td>
                    <td colspan="2">EAD Lab</td>
                    
                    
                </tr>

            </tbody>
        </table>
    </div>
</body>
</html>
